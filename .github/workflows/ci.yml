name: CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Full debuginfo makes the target dir ~15G and dominates link time. Line tables keep
      # file:line in backtraces.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7

      # Read only: the dev shell is pushed explicitly below
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            extra-substituters = https://nix-cache.andyyu.io
            extra-trusted-public-keys = nix-cache.andyyu.io-1:+SGDInebCOChTtOfCeGffBw3qjb73Sq/FSDIj4K+CbU=

      - name: Build dev shell
        run: nix develop --profile "$RUNNER_TEMP/dev-shell" -c true

      # The dev shell's closure to niks3 (niks3.andyyu.io, read at nix-cache.andyyu.io). Its
      # container stops when idle, so the first request can fail while it starts.
      - name: Push dev shell to the Nix cache
        if: github.event_name != 'merge_group'
        env:
          NIKS3_AUTH_TOKEN: ${{ secrets.NIKS3_AUTH_TOKEN }}
        run: |
          [ -n "$NIKS3_AUTH_TOKEN" ] || exit 0
          token=$(mktemp)
          printf '%s' "$NIKS3_AUTH_TOKEN" >"$token"
          nix shell --inputs-from . nixpkgs#niks3 -c niks3 push \
            --server-url https://niks3.andyyu.io --auth-token-path "$token" --retry-timeout 2m \
            "$(readlink -f "$RUNNER_TEMP/dev-shell")"
          rm -f "$token"

      - uses: Swatinem/rust-cache@v2
        with:
          # Key on the nix toolchain; outside the shell rustup installs rust-toolchain.toml first.
          cmd-format: nix develop -c {0}
          key: ${{ hashFiles('flake.lock') }}
          save-if: ${{ github.event_name != 'merge_group' }}

      - name: Build tests
        run: nix develop -c cargo nextest run --workspace --exclude 'plugin-*' --profile ci --no-run

      - name: Test
        run: nix develop -c cargo nextest run --workspace --exclude 'plugin-*' --profile ci
        env:
          ZI_LOG: zi=debug,zi_lsp=debug

      - name: Doctests
        run: nix develop -c cargo test --workspace --exclude 'plugin-*' --doc

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
