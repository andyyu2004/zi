name: CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether each job has passed on this source and dev shell: its store path (flake.nix ci)
  # is in the Nix cache. Pull requests and merge groups skip on any pass, master only on its
  # own, as its runs save the Rust cache. A skipped job still satisfies the ruleset's
  # required check.
  plan:
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.plan.outputs.test }}
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/determinate-nix-action@v3

      - id: plan
        env:
          REFS: ${{ github.event_name == 'push' && 'master' || 'pr master' }}
        run: |
          jobs=(test)
          for job in "${jobs[@]}"; do
            run=true
            for ref in $REFS; do
              marker=$(nix eval --raw ".#ci.x86_64-linux.$job.$ref")
              if nix path-info --store https://nix-cache.andyyu.io "$marker" >/dev/null 2>&1; then
                echo "$job passed as $marker"
                run=false
              fi
            done
            echo "$job=$run" >>"$GITHUB_OUTPUT"
          done

  test:
    needs: plan
    if: needs.plan.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Full debuginfo makes the target dir ~15G and dominates link time. Line tables keep
      # file:line in backtraces.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7

      # Read only: the dev shell is pushed explicitly below
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            extra-substituters = https://nix-cache.andyyu.io
            extra-trusted-public-keys = nix-cache.andyyu.io-1:+SGDInebCOChTtOfCeGffBw3qjb73Sq/FSDIj4K+CbU=

      - name: Build dev shell
        run: nix develop --profile "$RUNNER_TEMP/dev-shell" -c true

      - name: Push dev shell to the Nix cache
        if: github.event_name != 'merge_group'
        env:
          NIKS3_AUTH_TOKEN: ${{ secrets.NIKS3_AUTH_TOKEN }}
        run: .github/niks3-push.sh "$(readlink -f "$RUNNER_TEMP/dev-shell")"

      - uses: Swatinem/rust-cache@v2
        with:
          # Key on the nix toolchain; outside the shell rustup installs rust-toolchain.toml first.
          cmd-format: nix develop -c {0}
          key: ${{ hashFiles('flake.lock') }}
          save-if: ${{ github.event_name != 'merge_group' }}

      - name: Build tests
        run: nix develop -c cargo nextest run --workspace --exclude 'plugin-*' --profile ci --no-run

      - name: Test
        run: nix develop -c cargo nextest run --workspace --exclude 'plugin-*' --profile ci
        env:
          ZI_LOG: zi=debug,zi_lsp=debug

      - name: Doctests
        run: nix develop -c cargo test --workspace --exclude 'plugin-*' --doc

      - name: Record the pass
        env:
          NIKS3_AUTH_TOKEN: ${{ secrets.NIKS3_AUTH_TOKEN }}
          REF: ${{ github.event_name == 'push' && 'master' || 'pr' }}
        run: .github/niks3-push.sh "$(nix eval --raw ".#ci.x86_64-linux.test.$REF")"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
