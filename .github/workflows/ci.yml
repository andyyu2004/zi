name: CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether each job has passed on this source and dev shell: its store path (flake.nix ci)
  # is in the Nix cache. Pushes to master run every job, as they save the Rust cache that
  # pull requests start from. A skipped job still satisfies the ruleset's required check.
  plan:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/determinate-nix-action@v3

      - id: plan
        run: |
          keys=$(nix eval --json .#ci.x86_64-linux)
          run=()
          for job in $(jq -r 'keys[]' <<<"$keys"); do
            key=$(jq -r --arg job "$job" '.[$job]' <<<"$keys")
            if [ "$GITHUB_EVENT_NAME" != push ] &&
              nix path-info --store https://nix-cache.andyyu.io "$key" >/dev/null 2>&1; then
              echo "$job passed as $key"
            else
              run+=("$job")
            fi
          done
          echo "run=$(jq -cn '$ARGS.positional' --args "${run[@]}")" >>"$GITHUB_OUTPUT"

  clippy:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.run), 'clippy')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            extra-substituters = https://nix-cache.andyyu.io
            extra-trusted-public-keys = nix-cache.andyyu.io-1:+SGDInebCOChTtOfCeGffBw3qjb73Sq/FSDIj4K+CbU=

      - uses: Swatinem/rust-cache@v2
        with:
          cmd-format: nix develop -c {0}
          key: ${{ hashFiles('flake.lock') }}
          save-if: ${{ github.event_name != 'merge_group' }}

      - name: Clippy
        run: nix develop -c cargo clippy --workspace --exclude 'plugin-*' --all-targets -- -D warnings

      - name: Clippy (plugins)
        run: nix develop -c cargo clippy -p 'plugin-*' --target wasm32-unknown-unknown --all-targets -- -D warnings

      - name: Record the pass
        env:
          NIKS3_AUTH_TOKEN: ${{ secrets.NIKS3_AUTH_TOKEN }}
        run: .github/niks3-push.sh "$(nix eval --raw ".#ci.x86_64-linux.$GITHUB_JOB")"

  test:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.run), 'test')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Full debuginfo makes the target dir ~15G and dominates link time. Line tables keep
      # file:line in backtraces.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7

      # Read only: the dev shell is pushed explicitly below
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            extra-substituters = https://nix-cache.andyyu.io
            extra-trusted-public-keys = nix-cache.andyyu.io-1:+SGDInebCOChTtOfCeGffBw3qjb73Sq/FSDIj4K+CbU=

      - name: Build dev shell
        run: nix develop --profile "$RUNNER_TEMP/dev-shell" -c true

      - name: Push dev shell to the Nix cache
        if: github.event_name != 'merge_group'
        env:
          NIKS3_AUTH_TOKEN: ${{ secrets.NIKS3_AUTH_TOKEN }}
        run: .github/niks3-push.sh "$(readlink -f "$RUNNER_TEMP/dev-shell")"

      - uses: Swatinem/rust-cache@v2
        with:
          # Key on the nix toolchain; outside the shell rustup installs rust-toolchain.toml first.
          cmd-format: nix develop -c {0}
          key: ${{ hashFiles('flake.lock') }}
          save-if: ${{ github.event_name != 'merge_group' }}

      - name: Build tests
        run: nix develop -c cargo nextest run --workspace --exclude 'plugin-*' --profile ci --no-run

      - name: Test
        run: nix develop -c cargo nextest run --workspace --exclude 'plugin-*' --profile ci
        env:
          ZI_LOG: zi=debug,zi_lsp=debug

      - name: Doctests
        run: nix develop -c cargo test --workspace --exclude 'plugin-*' --doc

      - name: Record the pass
        env:
          NIKS3_AUTH_TOKEN: ${{ secrets.NIKS3_AUTH_TOKEN }}
        run: .github/niks3-push.sh "$(nix eval --raw ".#ci.x86_64-linux.$GITHUB_JOB")"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
