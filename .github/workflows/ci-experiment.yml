name: CI experiment

on:
  push:
    branches: [ci-build-times]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline
            cfg: ""
            pre: ""
          - name: deps-nodebug
            cfg: --config 'profile.dev.package."*".debug=false'
            pre: ""
          - name: all-linetables
            cfg: --config 'profile.dev.debug="line-tables-only"'
            pre: ""
          - name: deps-nodebug-ws-linetables
            cfg: --config 'profile.dev.package."*".debug=false' --config 'profile.dev.debug="line-tables-only"'
            pre: ""
          - name: mold
            cfg: ""
            pre: export PATH=$(nix build --no-link --print-out-paths nixpkgs#mold)/bin:$PATH RUSTFLAGS="-Clink-arg=-fuse-ld=mold";
          - name: cranelift-o1
            cfg: --config 'profile.dev.package.cranelift-codegen.opt-level=1'
            pre: ""
          - name: deps-o0
            cfg: --config 'profile.dev.package."*".opt-level=0'
            pre: ""
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: andyyu2004
          skipPush: true
      - name: Build dev shell
        run: nix develop -c true
      - name: Build tests
        run: nix develop -c bash -c '${{ matrix.pre }} cargo nextest run ${{ matrix.cfg }} --workspace --exclude "plugin-*" --profile ci --no-run --timings'
      - name: Test
        run: nix develop -c bash -c '${{ matrix.pre }} cargo nextest run ${{ matrix.cfg }} --workspace --exclude "plugin-*" --profile ci'
      - name: Touch and rebuild
        run: |
          echo >> zi-core/src/lib.rs
          nix develop -c bash -c '${{ matrix.pre }} cargo nextest run ${{ matrix.cfg }} --workspace --exclude "plugin-*" --profile ci --no-run'
      - name: Inspect
        if: always()
        run: |
          du -sh target target/* 2>/dev/null || true
          f=$(ls target/debug/deps/zi_core-* | grep -v '\.d$' | head -1); readelf -p .comment "$f" | grep -i -E 'lld|mold|GNU' | head -3 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: timings-${{ matrix.name }}
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
