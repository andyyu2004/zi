name: CI experiment

on:
  push:
    branches: [ci-build-times]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: deps-nodebug
            cfg: |
              [profile.dev.package."*"]
              debug = false
          - name: all-linetables
            cfg: |
              [profile.dev]
              debug = "line-tables-only"
          - name: deps-nodebug-ws-linetables
            cfg: |
              [profile.dev]
              debug = "line-tables-only"
              [profile.dev.package."*"]
              debug = false
          - name: deps-o0
            cfg: |
              [profile.dev.package."*"]
              opt-level = 0
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: andyyu2004
          skipPush: true
      - name: Profile override
        run: mkdir -p .cargo && printf '%s\n' "$CFG" > .cargo/config.toml && cat .cargo/config.toml
        env:
          CFG: ${{ matrix.cfg }}
      - name: Build dev shell
        run: nix develop -c true
      - name: Build tests
        run: nix develop -c cargo nextest run --workspace --exclude 'plugin-*' --profile ci --no-run --timings
      - name: Test
        run: nix develop -c cargo nextest run --workspace --exclude 'plugin-*' --profile ci
      - name: Touch and rebuild
        run: |
          echo >> zi-core/src/lib.rs
          nix develop -c cargo nextest run --workspace --exclude 'plugin-*' --profile ci --no-run
      - name: Inspect
        if: always()
        run: |
          du -sh target target/* 2>/dev/null || true
          f=$(ls target/debug/deps/zi_core-* | grep -v '\.d$' | head -1); readelf -p .comment "$f" | grep -i -E 'lld|mold|GNU' | head -3 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: timings-${{ matrix.name }}
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
