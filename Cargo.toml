[workspace]
resolver = "2"
members = [
    "fuzz",
    "plugins/*",
    "rel",
    "rel-derive",
    "stdx",
    "zi",
    "zi-core",
    "zi-indent",
    "zi-lsp",
    "zi-marktree",
    "zi-nvim",
    "zi-term",
    "zi-text",
    "zi-textobject",
    "zi-tui",
    "zi-wasm",
    "zi-event",
    "zi-test",
    "asciicast",
    "zi-input",
]
exclude = [
    "zi-lsp/tests/zi-lsp/testdirs/*",
]

[workspace.dependencies]
asciicast = { path = "asciicast" }
zi = { path = "zi" }
zi-core = { path = "zi-core" }
zi-wasm = { path = "zi-wasm" }
zi-event = { path = "zi-event" }
zi-indent = { path = "zi-indent" }
zi-lsp = { path = "zi-lsp" }
zi-marktree = { path = "zi-marktree" }
zi-nvim = { path = "zi-nvim" }
zi-input = { path = "zi-input" }
zi-test = { path = "zi-test" }
zi-text = { path = "zi-text" }
zi-textobject = { path = "zi-textobject" }
tui = { path = "zi-tui", package = "zi-tui" }
bitflags = "2.5.0"
chumsky = "0.9.3"
crop = { version = "0.4.2", features = ["graphemes", "utf16-metric"] }
stdx = { path = "stdx" }
arbitrary = { version = "1.3.2", features = ["derive"] }
rand = "0.10"
anyhow = "1.0.81"
arrayvec = "0.7.4"
async-trait = "0.1.80"
crossterm = "0.29.0"
divan = "0.1.14"
expect-test = "1.4.1"
proptest = "1.4.0"
futures-core = "0.3.30"
futures-executor = "0.3.30"
futures-util = "0.3.30"
itertools = "0.15"
mimalloc = "0.1.42"
parking_lot = "0.13"
unicode-width = "0.2"
tempfile = "3.10"
regex = "1"
regex-cursor = { version = "0.1.4", default-features = false, features = ["perf-inline"] }
rustc-hash = "2"
rel = { path = "rel" }
rel-derive = { path = "rel-derive" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
trybuild = "1.0.125"
slotmap = "1.0.7"
smol_str = "0.3"
smallvec = "2.0.0-alpha.6"
tokio = { version = "1.37.0", default-features = false }
tokio-stream = "0.1.15"
tokio-util = { version = "0.7.10", default-features = false }
tree-sitter = { version = "0.27.2" }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
ustr = "1"
url = "2"
wit-bindgen = "0.63"
dyn-clone = "1.0.17"
serde_json = "1.0.95"
streaming-iterator = "0.1"
mutants = "0.0.4"
test-strategy = "0.4"
tracing-test = "0.2.5"

[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package."*"]
opt-level = 1

[profile.bench]
debug = true

[profile.release]
debug = true

[workspace.lints.rust]
rust_2018_idioms = "deny"

[workspace.lints.rustdoc] # FIXME don't think this is working
broken_intra_doc_links = "warn"

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "deny", priority = -1 }
restriction = { level = "allow", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

single_range_in_vec_init = "allow"

# Pedantic lints that are noise here
# Internal crates, not a published API: no errors/panics docs or #[must_use] on every getter and builder.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
# Screen coordinates, offsets and line numbers move between u16/u32/usize/isize; the values are bounded.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Colours are written as 0xRRGGBB(AA).
unreadable_literal = "allow"
# Submodules share their parent's imports with `use super::*`.
wildcard_imports = "allow"
# Keymap, command and test tables are long by nature.
too_many_lines = "allow"
# Field names like `nvim: Neovim` in `Nvim` read fine.
struct_field_names = "allow"
# Its fix turns a match with a wildcard arm into if-let/else, which hides new variants (see wildcard_enum_match_arm).
single_match_else = "allow"
# Helper fns, consts and imports often sit next to their only use inside a function.
items_after_statements = "allow"
# `Default::default()` is preferred where the type is clear from context.
default_trait_access = "allow"

# Restriction lints
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "deny"
print_stderr = "warn"
print_stdout = "warn"
rc_buffer = "warn"
todo = "warn"
unimplemented = "warn"
wildcard_enum_match_arm = "warn"

[patch.crates-io]
crop = { git = "https://github.com/andyyu2004/crop", branch = "main" }

